apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: capstone-autoscaler
  namespace: star
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: capstone-project
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 2
